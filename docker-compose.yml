services:
  paper:
    image: itzg/minecraft-server:latest
    container_name: ainpc-demo
    ports:
      - "${SERVER_PORT:-25565}:25565"
      - "${RCON_PORT:-25575}:25575"
      - "127.0.0.1:${MCP_PORT:-39841}:39841"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MC_VERSION:-latest}"
      MEMORY: "${MEMORY:-4G}"
      ONLINE_MODE: "${ONLINE_MODE:-FALSE}"
      DIFFICULTY: "${DIFFICULTY:-peaceful}"
      MODE: "${MODE:-creative}"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      ALLOW_FLIGHT: "TRUE"
      MAX_PLAYERS: "${MAX_PLAYERS:-5}"
      MOTD: "${MOTD:-AINPC Demo - SAT DEMO}"
      ENABLE_RCON: "${ENABLE_RCON:-TRUE}"
      RCON_PASSWORD: "${RCON_PASSWORD:?Set RCON_PASSWORD before starting the demo server}"
      RCON_PORT: "${RCON_PORT:-25575}"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "FALSE"
      GENERATE_STRUCTURES: "TRUE"
      LEVEL_TYPE: FLAT
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","structures":{"structures":{"minecraft:village_plains":{},"minecraft:village_snowy":{},"minecraft:village_savanna":{},"minecraft:village_desert":{},"minecraft:village_taiga":{}}}}'
    volumes:
      - ./paper-data/plugins:/plugins
      - ./paper-data/data:/data
      - ./paper-data/world:/world
      - ./paper-data/world_nether:/world_nether
      - ./paper-data/world_the_end:/world_the_end
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - ainpc-net

  mcp-sidecar:
    image: openjdk:21-slim
    container_name: ainpc-mcp-sidecar
    network_mode: "service:paper"
    environment:
      SPRING_PROFILES_ACTIVE: local-bridge
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 39841
      MCP_MODE: bridge
      MCP_SNAPSHOT_PATH: /app/ainpc-plugin/data/mcp-runtime-snapshot.json
      MCP_COMMAND_PATH: /app/ainpc-plugin/data/mcp-commands
      MCP_AUDIT_PATH: /app/ainpc-plugin/data/mcp-write-audit.json
    volumes:
      - ./ainpc-mcp-service/build/libs:/app/libs
      - ./paper-data/plugins/AINPCPlugin:/app/ainpc-plugin
    working_dir: /app
    entrypoint: >
      sh -c "java -jar libs/ainpc-mcp-service.jar --spring.config.additional-location=optional:file:/app/ainpc-plugin/application.yml"
    restart: unless-stopped
    depends_on:
      - paper

networks:
  ainpc-net:
    driver: bridge
