      morning:
        label: "Dimineata"
        start_tick: 0
        end_tick: 6000
        slot: "WORK"
        activity: "munca"
      afternoon:
        label: "Dupa-amiaza"
        start_tick: 6000
        end_tick: 12000
        slot: "WORK"
