name: AINPC Build & Test

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build all modules
        run: ./gradlew build --no-daemon

      - name: Run core plugin tests
        run: ./gradlew :ainpc-core-plugin:test --no-daemon

      - name: Run API module tests
        run: ./gradlew :ainpc-api:test --no-daemon

      - name: Run MCP service tests
        run: ./gradlew :ainpc-mcp-service:test --no-daemon

      - name: Run scenario tests
        run: ./gradlew :ainpc-scenario-medieval:test --no-daemon

      - name: Run all tests
        run: ./gradlew test --no-daemon

      - name: Check for compiler warnings
        run: |
          BUILD_LOG=$(./gradlew build --no-daemon 2>&1)
          WARNINGS=$(echo "$BUILD_LOG" | grep -c "w:" || true)
          echo "Compiler warnings: $WARNINGS"
          if [ "$WARNINGS" -gt 50 ]; then
            echo "Too many warnings ($WARNINGS)!" >&2
            exit 1
          fi

      - name: Verify JAR artifacts exist
        run: |
          ls -la ainpc-core-plugin/build/libs/*.jar
          ls -la ainpc-api/build/libs/*.jar
          ls -la ainpc-scenario-medieval/build/libs/*.jar

      - name: Upload core plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ainpc-core-plugin-jdk${{ matrix.java }}
          path: ainpc-core-plugin/build/libs/*.jar

      - name: Upload MCP service JAR
        uses: actions/upload-artifact@v4
        with:
          name: ainpc-mcp-service-jdk${{ matrix.java }}
          path: ainpc-mcp-service/build/libs/*.jar

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Check Kotlin code style
        run: ./gradlew kotlinLint --no-daemon || true

  test-report:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Generate test report
        run: ./gradlew test --no-daemon

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: "**/build/test-results/test/TEST-*.xml"
          reporter: java-junit
