plugins {
    id 'org.jetbrains.kotlin.plugin.serialization'
}

description = 'AINPC Core Plugin'

dependencies {
    api project(':ainpc-api')

    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
    // WorldEdit API is resolved at runtime via reflection if WorldEdit is installed
    // No compile-time dependency needed

    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
    implementation "com.zaxxer:HikariCP:${hikariVersion}"
    implementation "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"
    // kotlinx.serialization for template files
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    testImplementation "io.papermc.paper:paper-api:${paperVersion}"
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.WARN
    dependsOn configurations.runtimeClasspath

    from({
        configurations.runtimeClasspath
                .findAll { it.exists() }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/versions/**/module-info.class'
        exclude 'META-INF/services/java.sql.Driver'
    }
}
