# ========================================
# Feature Pack: Social
# Relatii sociale, barfa, prietenii si conflicte intre NPC-uri
# ========================================

id: social
name: "Social"
description: "Relatii sociale intre NPC-uri: barfa, prietenii, aliante, dușmanii si evenimente sociale."
addon:
  type: "feature"
  version: "1.0.0"
  runtime_modes: ["standalone", "hybrid", "advanced"]
  capabilities: ["traits", "dialogues", "social", "gossip", "relationships"]

traits:
  gossip:
    name: "Barfitor"
    description: "Colecteaza si raspandeste barfa prin sat."
    modifiers:
      action_scores:
        GOSSIP: 20
        TALK: 15
        HELP: -3
      emotions:
        trust: -0.05

  friendly:
    name: "Prietenos"
    description: "Face prieteni usor si mentine relatii bune."
    modifiers:
      action_scores:
        HELP: 12
        TALK: 14
        TRADE: 8
      emotions:
        trust: 0.2
        joy: 0.1

  shy:
    name: "Timid"
    description: "Evita multimea si prefera compania familiara."
    modifiers:
      action_scores:
        TALK: -8
        GOSSIP: -12
        HELP: 4
      emotions:
        trust: -0.1
        fear: 0.1

  charismatic:
    name: "Carismatic"
    description: "Atrage atentia si conduce conversatiile cu usurinta."
    modifiers:
      action_scores:
        TALK: 18
        GOSSIP: 14
        TRADE: 10
      emotions:
        trust: 0.15
        joy: 0.1

dialogues:
  social_greeting:
    - "Salutare, %player%! Ce mai faci?"
    - "Buna ziua! Ma bucur sa te vad."
    - "Hei! Vrei sa auzi noutatile?"
    - "Salut, bine ai venit in sat!"

  social_farewell:
    - "Pe curand, %player%!"
    - "Sa ai o zi buna!"
    - "Ma bucur ca am vorbit."
    - "Ne vedem la piata!"

  social_gossip:
    - "Am auzit ca %npc% a patit ceva ieri..."
    - "Stii ceva despre %npc%? Se zice ca..."
    - "Barfa pe care am prins-o azi e ca %npc%..."
    - "Nu spune nimanui, dar am vazut pe %npc%..."

  social_compliment:
    - "Arati bine azi, %player%!"
    - "Ce bine ca ai venit, %player%!"
    - "Stiam eu ca pot conta pe tine!"
    - "Bravo, %player%! Ai facut o treaba buna."

  social_weather:
    - "Ce vreme frumoasa azi!"
    - "Pare ca o sa ploua..."
    - "Sper sa nu fie prea frig azi."
    - "Vantul bate azi mai tare ca de obicei."

  social_rumor:
    - "Am prins o vorba ca se pregateste ceva mare..."
    - "Am auzit un zvon interesant despre %place%."
    - "Circula vorba ca %npc% si %other_npc% nu se mai inteleg."
    - "Se zice ca in %region% s-ar fi intamplat ceva neobisnuit."

  social_relationship:
    - "%npc% si %other_npc% sunt prieteni buni."
    - "%npc% nu prea agreeaza cu %other_npc%."
    - "Am vazut ca %npc% si %other_npc% au vorbit lung si bine."
    - "Familiile lui %npc% si %other_npc% sunt apropiate."
