spring:
  application:
    name: ainpc-mcp-service
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
  profiles:
    active: static

mcp:
  mode: static

server:
  address: 127.0.0.1
  port: 39841

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
