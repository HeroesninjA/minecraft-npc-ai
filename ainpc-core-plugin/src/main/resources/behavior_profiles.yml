# AINPC Behavior Profiles
# Each profile defines NPC behavior: schedule, movement, reactions.
# Usage: /ainpc routine profiles

default_profile: "villager"
profiles:
  villager:
    occupation: "villager"
    display_name: "Sattean"
    movement_speed: 0.6
    wander_radius: 8.0
    home_return: true
    socialize_chance: 0.3
    weather_reactions: true
    night_return: true
    routine_bias_ticks: 0
    routine_goals:
      home: "sa fie acasa"
      work: "sa mearga la treaba"
      social: "sa socializeze in sat"
      idle: "sa astepte o activitate"
    routine_texts:
      night_sleep: "doarme acasa"
      wake_start: "se trezeste si isi pregateste ziua"
      low_needs_home: "revine acasa pentru siguranta si refacere"
      work_day: "merge la lucru"
      work_afternoon: "inchide treburile principale ale zilei"
      social_day: "merge la punctul social pentru a vorbi cu localnicii"
      social_evening: "se intalneste cu localnicii seara"
      fallback_social: "foloseste punctul social"
      fallback_home: "ramane aproape de casa"
      fallback_idle: "sa astepte pana exista o ancora utila"
      idle: "isi urmeaza rutina obisnuita"
    fallback_rules:
      - condition: "night"
        slot: "HOME"
        activity_key: "night_sleep"
        state: "SLEEPING"
      - condition: "low_needs"
        slot: "HOME"
        activity_key: "low_needs_home"
        state: "RESTING"
      - condition: "social_need"
        slot: "SOCIAL"
        activity_key: "social_day"
        state: "SOCIALIZING"
      - condition: "work_morning"
        slot: "WORK"
        activity_key: "work_day"
        state: "WORKING"
      - condition: "work_afternoon"
        slot: "WORK"
        activity_key: "work_afternoon"
        state: "WORKING"
      - condition: "social_evening"
        slot: "SOCIAL"
        activity_key: "social_evening"
        state: "SOCIALIZING"
      - condition: "default"
        slot: "IDLE"
        activity_key: "fallback_idle"
        state: "IDLE"
    thresholds:
      energy_low: 25
      hunger_low: 25
      safety_low: 35
      social_need_low: 35
    slot_states:
      home: "RESTING"
      work: "WORKING"
      social: "SOCIALIZING"
      idle: "IDLE"
    zone_states:
      forest: "FARMING"
      dark_forest: "FARMING"
      jungle: "FARMING"
      plains: "WORKING"
      mountain: "MINING"
      underground: "MINING"
      river: "FISHING"
      coast: "FISHING"
      ocean: "FISHING"
      interior: "WORKING"
      default: "WORKING"
    zone_activity_suffixes:
      forest: "in padure"
      dark_forest: "in padure"
      jungle: "in jungla"
      plains: "pe camp"
      mountain: "pe munte"
      underground: "in subteran"
      river: "la rau"
      coast: "pe coasta"
      ocean: "pe ocean"
      interior: "in interior"
    preview_points:
      - label: "Noapte"
        world_time: 19000
      - label: "Dimineata"
        world_time: 6000
      - label: "Pranz"
        world_time: 13000
      - label: "Seara"
        world_time: 17000
    phase_ticks:
      wake_start: 2000
      work_start: 2000
      midday_start: 12000
      evening_start: 16000
      social_start: 8000
      social_end: 18000
      night_start: 18000
    schedule:
      morning:
        label: "Dimineata"
        start_tick: 0
        end_tick: 6000
        slot: "HOME"
        activity: "pregateste"
        target: "home"
        state: "RESTING"
      work:
        label: "Munca"
        start_tick: 6000
        end_tick: 12000
        slot: "WORK"
        activity: "munca"
        state: "WORKING"
      evening:
        label: "Seara"
        start_tick: 12000
        end_tick: 13800
        slot: "HOME"
        activity: "odihneste"
        state: "RESTING"
      night:
        label: "Noapte"
        start_tick: 13800
        end_tick: 24000
        slot: "HOME"
        activity: "doarme"
        state: "SLEEPING"

