      evening:
        label: "Seara"
        start_tick: 12000
        end_tick: 13800
        slot: "HOME"
        activity: "odihneste"
      night:
        label: "Noapte"
        start_tick: 13800
        end_tick: 24000
        slot: "HOME"
        activity: "doarme"
