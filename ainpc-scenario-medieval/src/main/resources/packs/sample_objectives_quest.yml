id: sample_objectives
name: "Quest Exemplu - Toate Tipurile de Obiective"
description: "Quest demonstrativ care acopera toate tipurile de obiective suportate."
addon:
  type: "scenario"
  version: "1.0.0"
scenarios:
  sample_quest:
    name: "Exemplu Complet de Obiective"
    description: "Acest quest arata toate tipurile de obiective disponibile."
    base_type: "QUEST"
    mechanic: "side_quests"
    trigger_probability: 0.0
    min_npcs: 0
    conditions:
      cooldown_check:
        type: "quest_cooldown"
        template_id: "SAMPLE01"
        seconds: 600
      prereq_check:
        type: "quest_prerequisite"
        template_id: "MAIN_Q01"
    runtime_triggers:
      enter_village:
        type: "player_enters_region"
        region_id: "demo_sat"
        actions:
          - send_welcome_message
      talk_to_guard:
        type: "player_talks_to_npc"
        profession: "guard"
        actions:
          - greet_player
    runtime_actions:
      send_welcome_message:
        type: "send_message"
        message: "&6Bun venit in satul demonstrativ!"
      greet_player:
        type: "send_message"
        message: "&eSalut, calatorule. Ai nevoie de ajutor?"
    requires_player: true
    phases:
      START: "Inceput"
      COLLECT: "Colectare"
      EXPLORE: "Explorare"
      CRAFT: "Crafting"
      BUILD: "Constructie"
      COMBAT: "Combat"
      DELIVERY: "Livrare"
      USE: "Utilizare"
      EQUIP: "Echipare"
      COMPLETE: "Final"
    quest:
      code: "SAMPLE01"
      giver_profession: "guard"
      kind: "investigation"
      category: "side"
      acceptance_mode: "explicit"
      completion_mode: "return_to_giver"
      tags:
        - sample
        - tutorial
      objectives:
        # Social
        talk_to_villager:
          type: "talk_to_npc"
          item: "profession:garda"
          amount: 1
          description: "Vorbeste cu gardianul."
        # Colectare
        gather_wood:
          type: "collect_item"
          item: "OAK_LOG"
          amount: 10
          description: "Colecteaza 10 busteni de stejar."
        # Explorare
        visit_village:
          type: "visit_region"
          item: "demo_sat"
          amount: 1
          description: "Viziteaza satul."
        enter_house:
          type: "visit_place"
          item: "demo_sat:house_1"
          amount: 1
          description: "Intra in casa."
        inspect_chest:
          type: "inspect_node"
          item: "demo_sat:house_1:bed_1"
          amount: 1
          description: "Inspecteaza patul din casa."
        # Crafting
        craft_sword:
          type: "craft_item"
          item: "IRON_SWORD"
          amount: 1
          description: "Craft-uieste o sabie de fier."
        # Constructie
        place_fence:
          type: "place_block"
          item: "OAK_FENCE"
          amount: 5
          description: "Plaseaza 5 garduri de stejar."
        break_stone:
          type: "break_block"
          item: "COBBLESTONE"
          amount: 10
          description: "Sparge 10 pietre de rau."
        # Combat
        kill_zombie:
          type: "kill_mob"
          item: "ZOMBIE"
          amount: 3
          description: "Ucide 3 zombies."
        # Livrare
        deliver_report:
          type: "deliver_to_npc"
          item: "profession:garda"
          amount: 1
          description: "Preda raportul gardianului."
        # Utilizare item
        consume_potion:
          type: "use_item"
          item: "POTION"
          amount: 1
          description: "Bea o potiune."
        # Echipare item
        equip_helmet:
          type: "equip_item"
          item: "IRON_HELMET"
          amount: 1
          description: "Echipeaza o casca de fier."
      rewards:
        reward_gold:
          type: "item"
          item: "EMERALD"
          amount: 5
          description: "Primesti 5 smaralde."
        reward_xp:
          type: "experience"
          amount: 50
          description: "Primesti 50 XP."
        reward_progression_xp:
          type: "progression:xp"
          amount: 100
          description: "Primesti 100 XP in sistemul de progresie al jucatorului."
        reward_progression_skill:
          type: "progression:skill"
          item: "combat"
          amount: 25
          description: "Primesti 25 XP in skill-ul combat."
        reward_reputation_region:
          type: "reputation:region"
          item: "demo_sat"
          amount: 10
          description: "Primesti 10 reputatie in regiunea demo_sat."
        reward_reputation_faction:
          type: "reputation:faction"
          item: "knights"
          amount: 5
          description: "Primesti 5 reputatie in factiunea knights."
        reward_reputation_penalty:
          type: "reputation:faction"
          item: "bandits"
          amount: 15
          metadata:
            penalty: "true"
          description: "Pierzi 15 reputatie la factiunea bandits (penalty)."
        reward_progression_skill_level:
          type: "progression:skill_level"
          item: "combat"
          amount: 3
          description: "Seteaza skill-ul combat la nivel 3."

# Comentariu: penalty:true (sau sign:-) inverseaza amount-ul; util pentru recompense negative
# precum reputatie, unde QuestEntryDefinition impune amount >= 1.
# Alte metadata acceptate: penalty:true|1|yes, sign:+|positive, sign:-|negative
